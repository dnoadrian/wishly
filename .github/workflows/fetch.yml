name: fetch-test
on:
  push:
    branches: [claude/gaming-wishlist-price-tracker-wdo67z]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          get() { curl -sSL -m 30 -A "$UA" -H 'Accept: text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8' -H 'Accept-Language: de-AT,de;q=0.9,en;q=0.8' -H 'Cookie: localization=AT; cart_currency=EUR' -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" || true; }
          get clever.html 'https://www.clevertronic.de/kaufen/handy-kaufen/apple/iphone-15-pro/auswahl/19945/apple-iphone-15-pro-256gb-titan-schwarz?t=1&ok=11&mfvi=45211'
          get amazon.html 'https://www.amazon.de/Raspberry-Pi-5-16-GB/dp/B0DSPYPKRG'
          get amazon2.html 'https://www.amazon.de/dp/B0DSPYPKRG?th=1&psc=1'
          get amazon-offers.html 'https://www.amazon.de/gp/product/ajax/aodAjaxMain/ref=dp_aod_unknown_mbc?asin=B0DSPYPKRG&pc=dp'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: out
