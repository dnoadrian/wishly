name: fetch-test
on:
  push:
    branches: [claude/gaming-wishlist-price-tracker-wdo67z]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[pages]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          t() { n=$1; shift; curl -sSL -m 25 -A "$UA" -H 'Accept: text/html,application/json,*/*' -H 'Accept-Language: de-DE,de;q=0.9' -o "out/$n" -w "$n %{http_code} %{size_download} %{content_type}\n" "$@" >> out/codes.txt 2>>out/err.txt || echo "$n fail" >> out/codes.txt; }
          P='/kaufen/handy-kaufen/apple/iphone-15-pro/auswahl/19945/apple-iphone-15-pro-256gb-titan-schwarz?t=1&ok=11&mfvi=45211'
          t c1.html "https://www.clevertronic.de$P"
          t c2.html "https://clevertronic.de$P"
          t c3.html "https://m.clevertronic.de$P"
          t robots.txt "https://www.clevertronic.de/robots.txt"
          t sitemap.xml "https://www.clevertronic.de/sitemap.xml"
          t api1.json "https://www.clevertronic.de/api/product/19945"
          t api2.json "https://api.clevertronic.de/"
          t shop.html "https://shop.clevertronic.de/"
          t gshop.html "https://www.google.com/search?q=clevertronic+iphone+15+pro+256gb+titan+schwarz&hl=de"
          t idealo.html "https://www.idealo.de/preisvergleich/MainSearchProductCategory.html?q=clevertronic+iphone+15+pro+256"
          t bing.html "https://www.bing.com/search?q=site%3Aclevertronic.de+iphone+15+pro+256gb+titan+schwarz"
          t ddg.html "https://html.duckduckgo.com/html/?q=clevertronic+iphone+15+pro+256gb+titan+schwarz"
          t jina.txt "https://r.jina.ai/https://www.clevertronic.de$P"
          dig +short www.clevertronic.de > out/dns.txt; dig +short TXT clevertronic.de >> out/dns.txt
          ls -la out; cat out/*.log 2>/dev/null || true
      - run: |
          mkdir -p fetched && mv out/* fetched/
          git config user.name ci && git config user.email ci@example.com
          git add fetched && git commit -m "[pages] abgerufene Seiten" && git push
